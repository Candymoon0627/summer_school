- knowledge_type: term_explanation
  title: "Fractions as equal parts"
  region_code: pattani
  visibility_scope: shared_region
  subject: math
  topic: fractions
  target_grade: 4
  grade_min: 3
  grade_max: 5
  content_en: "A fraction shows how many equal parts of a whole are being used. In 3/4, the denominator 4 means the whole is divided into four equal parts, and the numerator 3 means three of those parts are counted."
  content_th: "เศษส่วนแสดงจำนวนส่วนที่เท่ากันของสิ่งหนึ่งทั้งหมด ใน 3/4 ตัวส่วน 4 หมายถึงแบ่งทั้งหมดเป็น 4 ส่วนเท่า ๆ กัน และตัวเศษ 3 หมายถึงนับมา 3 ส่วนนั้น"
  content_ms: "Pecahan menunjukkan bahagian yang sama besar daripada satu keseluruhan. Dalam 3/4, 4 ialah jumlah bahagian sama, dan 3 ialah bahagian yang diambil."
  local_context: "Use sharing roti, fruit, or fish portions at a Pattani market as familiar examples."
  classroom_use: "Ask students to draw one whole object, split it into equal parts, shade a fraction, then explain numerator and denominator."
  safety_notes: "Avoid food examples that assume every student can buy the same items."
  quality_score: 4
  source_type: oer_synthetic_test
  source_confidence: medium
  source_note: "Self-authored MVP test item based on general elementary math concepts; suitable for pipeline testing, not final curriculum approval."
  verified: true

- knowledge_type: teaching_activity
  title: "Equivalent fractions with paper strips"
  region_code: pattani
  visibility_scope: shared_region
  subject: math
  topic: equivalent fractions
  target_grade: 4
  grade_min: 3
  grade_max: 5
  content_en: "Equivalent fractions name the same amount even when the numerator and denominator are different. For example, 1/2 and 2/4 cover the same length on matching strips."
  content_th: "เศษส่วนที่เท่ากันหมายถึงปริมาณเดียวกัน แม้ตัวเศษและตัวส่วนต่างกัน เช่น 1/2 และ 2/4 มีความยาวที่ถูกระบายเท่ากันบนแถบกระดาษที่ขนาดเท่ากัน"
  content_ms: "Pecahan setara menunjukkan jumlah yang sama walaupun nombor berbeza. Contohnya 1/2 dan 2/4 meliputi panjang yang sama."
  local_context: "Use folded paper strips; no special materials are required."
  classroom_use: "Students fold one strip into halves and another into fourths, shade 1/2 and 2/4, then compare the shaded lengths."
  safety_notes: "If scissors are used, supervise cutting or prepare strips before class."
  quality_score: 4
  source_type: oer_synthetic_test
  source_confidence: medium
  source_note: "Self-authored MVP test item based on general elementary math concepts."
  verified: true

