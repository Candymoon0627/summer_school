  content_ms: "Perimeter ialah jumlah jarak di sekeliling bentuk. Untuk segi empat tepat, tambah semua sisi atau gunakan 2 kali panjang tambah 2 kali lebar."
  local_context: "Measure the edge of a classroom mat, table, or exercise book."
  classroom_use: "Pairs measure length and width with a ruler or string, calculate perimeter, and compare methods."
  safety_notes: "Keep movement around the classroom slow and organized."
  quality_score: 4
  source_type: oer_synthetic_test
  source_confidence: medium
