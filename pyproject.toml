[project]
name = "edu-ai-assistant"
version = "0.1.0"
description = "MVP scaffold for a LINE-based localized AI lesson plan assistant."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.111.0",
  "google-genai>=0.3.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "line-bot-sdk>=3.11.0",
  "pgvector>=0.3.2",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "rq>=1.16.2",
  "sentry-sdk[fastapi]>=2.12.0",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.5",
  "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
